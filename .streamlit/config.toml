# Slate theme, laid out as an early-2000s bulletin board:
# canvas 60 %, type and borders 30 %, one accent for the selection class only.
# What this file cannot express (category bars, ruled boards, row stripes, mono chips and ids)
# lives in udg_catalogue/ui/theme.py.

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#6366F1"
backgroundColor = "#F4F5F7"
secondaryBackgroundColor = "#E2E5EA"
textColor = "#334155"
linkColor = "#334155"
linkUnderline = true
borderColor = "#334155"
dataframeBorderColor = "#E2E5EA"
dataframeHeaderBackgroundColor = "#E2E5EA"
codeBackgroundColor = "#E2E5EA"
codeTextColor = "#334155"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0px"
buttonRadius = "0px"
baseFontSize = 14
font = "Verdana, Tahoma, DejaVu Sans, Segoe UI, sans-serif"
headingFont = "Verdana, Tahoma, DejaVu Sans, Segoe UI, sans-serif"
codeFont = "JetBrains Mono, IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace"
codeFontSize = "12px"
headingFontSizes = ["20px", "16px", "14px", "14px", "14px", "14px"]
headingFontWeights = [700, 700, 700, 700, 700, 700]
# Data colours, mirrored from udg_catalogue/ui/tokens.py: the Okabe-Ito order for
# identity and ten Viridis steps for a measure.
chartCategoricalColors = ["#0072B2", "#E69F00", "#009E73", "#D55E00", "#CC79A7", "#56B4E9"]
chartSequentialColors = ["#440154", "#482878", "#3E4A89", "#31688E", "#26828E", "#1F9E89", "#35B779", "#6DCD59", "#B4DE2C", "#FDE725"]

[theme.sidebar]
backgroundColor = "#F4F5F7"
secondaryBackgroundColor = "#E2E5EA"
