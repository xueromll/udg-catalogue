llm:
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  timeout: 120

http:
  user_agent: "UDG-ResearchScript/1.0 (lanhua1122333@gmail.com)"
  max_retries: 5
  backoff_factor: 5.0
  timeout: 25

# arXiv asks for one request at a time, about 3 s apart. A 429 or 503 pauses every arXiv request,
# for 60 s and then twice as long for each further one, up to 15 minutes.
arxiv:
  min_interval: 3.0
  jitter: 2.0
  cooldown: 60.0
  max_cooldown: 900.0

pipeline:
  # Quoted phrases, since arXiv splits an unquoted ultra-diffuse into two words and matched
  # unrelated papers; "ultra-diffuse" also matches "ultra diffuse". The acronym and the
  # well-known UDGs need astro-ph, as UDG is also a computer-science term (unit disk graph).
  search_query: >-
    cat:astro-ph* AND (ti:"ultra-diffuse" OR abs:"ultra-diffuse"
    OR ti:ultradiffuse OR abs:ultradiffuse OR ti:UDG OR abs:UDG OR ti:UDGs OR abs:UDGs
    OR ti:SMUDGes OR abs:SMUDGes
    OR ti:"NGC1052-DF2" OR abs:"NGC1052-DF2" OR ti:"NGC 1052-DF2" OR abs:"NGC 1052-DF2"
    OR ti:"NGC1052-DF4" OR abs:"NGC1052-DF4" OR ti:"NGC 1052-DF4" OR abs:"NGC 1052-DF4"
    OR ti:"Dragonfly 44" OR abs:"Dragonfly 44")
  total_limit: 2000
  page_size: 100
  search_delay: 0.0         # listing requests are paced by the arxiv section
  sleep_between: 5.0
  # Papers in flight. arXiv requests are paced by the arxiv section whatever this is,
  # so the rest is DeepSeek calls running in parallel with the downloads.
  max_concurrency: 16
  newest_first: true

paths:
  raw_catalogue: "data/udg_database.csv"
  sorted_catalogue: "data/udg_database_sorted.csv"
  processed_ids: "data/processed_arxiv_ids.txt"
  pipeline_metadata: "data/pipeline_meta.json"
  html_map: "output/udg_3d_map.html"
  analytics_dir: "output/figures"
  log_file: "output/pipeline.log"
  search_index: "data/paper_index.db"
  vector_memory: "data/paper_memory.db"
  llm_cache: "data/llm_cache.db"
  indexed_ids: "data/indexed_arxiv_ids.txt"
  indexing_metadata: "data/indexing_meta.json"
  rejections: "data/rejected_galaxies.db"
  run_manifest: "data/run_manifest.json"
  full_text_cache: "data/full_text"

embeddings:
  enabled: true
  provider: "local"
  model: "all-MiniLM-L6-v2"
  chunk_words: 350
  overlap_words: 50

search_index:
  cache_size_mb: 64
  mmap_size_mb: null

# Embedding prescreen ahead of the LLM relevance check (cascading filter). On the 462
# listings of the search query, every UDG paper scored at least 0.46 against the concepts.
prescreen:
  enabled: true
  threshold: 0.35

search:
  graph:
    depth: 2
    fanout: 8
    min_weight: 0.35
    max_nodes: 80

clustering:
  max_distance_mpc: 5.0
  min_samples: 2

deduplication:
  max_separation_arcsec: 3.0
